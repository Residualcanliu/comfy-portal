# ComfyPortal Prometheus 抓取配置（规格书 §7 + §9）。
# worker 跑在本地 Windows（非容器），target 需填 tailnet IP，部署时替换 __WORKER_IP__。
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: worker
    static_configs:
      - targets: ["__WORKER_IP__:9101"] # 本地 Windows worker，替换为 TAILNET_IP
