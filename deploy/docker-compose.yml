# ComfyPortal VPS 编排（规格书 §9）。部署前先配好 .env（TAILNET_IP / REDIS_PASSWORD 等）。
# 内存预算：2C2G，全容器约 1.2–1.7GB + 4G swap 兜底。OOM 先砍 Prometheus retention。

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: comfyportal-api:latest
    ports:
      - "127.0.0.1:8000:8000" # CF Tunnel 用
      - "${TAILNET_IP:?TAILNET_IP 必须设置}:8001:8000" # worker 用（内部接口）
    volumes:
      - ./data/artifacts:/data/artifacts
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN 必须设置}
      DAILY_QUOTA_DEFAULT: ${DAILY_QUOTA_DEFAULT:-20}
      ARTIFACTS_DIR: /data/artifacts
      # 内部接口的源 IP 闸门。缺省必须收紧到 tailnet，绝不能默认放过所有源 ——
      # 本仓库公开，INTERNAL_TOKEN 一旦沿用示例值，0.0.0.0/0 就等于没有这道闸门。
      TAILNET_CIDR: ${TAILNET_CIDR:-100.64.0.0/10}
    depends_on:
      - redis
      - postgres
    logging: &logging
      driver: json-file
      options:
        max-size: 10m

  redis:
    image: redis:7
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置}
      --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${TAILNET_IP:?TAILNET_IP 必须设置}:6379:6379"
    logging: *logging

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -c shared_buffers=256MB
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    # 不暴露端口 → 仅内部网络
    logging: *logging

  prometheus:
    image: prom/prometheus
    profiles: ["monitoring"]
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    logging: *logging

  grafana:
    image: grafana/grafana
    profiles: ["monitoring"]
    ports:
      - "${TAILNET_IP:?TAILNET_IP 必须设置}:3000:3000"
    environment:
      # 官方镜像不设此项时用 admin/admin，且只在首次登录提示改密。
      # 左边是 Grafana 读的变量名，右边是 .env 里的键名。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 必须设置}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    logging: *logging

  node_exporter:
    image: prom/node-exporter
    profiles: ["monitoring"]
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    logging: *logging
