[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-portal-api"
version = "0.1.0"
description = "ComfyPortal 控制面：认证 / 任务 / 工作流 / 画廊 / SSE / 内部接口"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "redis>=5.0",
  "rq>=1.16",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI 的 Depends() 在默认参数中是标准写法（B008 误报）；
# 产物文件写入是小文件阻塞，M1 阶段可接受（ASYNC230）
"app/**/*.py" = ["B008", "ASYNC230"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
