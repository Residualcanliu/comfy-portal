name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install packages/shared/python "apps/api[dev]"
      - run: ruff check apps/api
      - run: cd apps/api && pytest tests

  worker:
    name: worker (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e packages/shared/python -e "apps/worker[dev]"
      - run: ruff check apps/worker

  web:
    name: web (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build:web
      # 部署：web 通过 Vercel Git 集成自动部署（仓库连 Vercel 后自动触发）
